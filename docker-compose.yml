services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rasoi
      POSTGRES_PASSWORD: rasoi_dev
      POSTGRES_DB: rasoi_royale
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rasoi -d rasoi_royale"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://rasoi:rasoi_dev@db:5432/rasoi_royale
      SECRET_KEY: dev-secret-change-in-production
      CORS_ORIGINS: http://localhost:3000,http://10.0.2.2:8000
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app

volumes:
  postgres_data:
